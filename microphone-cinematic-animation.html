    "style": "photorealistic — must read as captured footage, never as a render",
    "pipeline": "physically based rendering throughout, spectral where available",
    "engine_hints": [
      "unbiased path tracing with full global illumination",
      "physically traced reflections and refraction on water and metal",
      "volumetric integration for fog, light shafts and atmospheric haze",
      "denoiser tuned to preserve micro-detail before grain is re-applied in post"
    ],
    "detail_level": "ultra-high — grille weave, brushed-metal micro-scratches, rock strata and needle clusters all resolve at 4K",
    "anti_synthetic_measures": [
      "no repeated textures or instanced patterns visible at 4K",
      "no perfectly straight ridgelines or evenly spaced trees",
      "highlight and shadow behavior driven by physical light transport only"
    ],
    "motion_blur": { "enabled": true, "shutter_angle_degrees": 180 },
    "anti_aliasing": "supersampling or high-sample temporal AA, no edge crawl",
    "color_pipeline": {
      "working_space": "ACEScg",
      "output": "Rec.709 / sRGB display-referred SDR master, HDR-ready grade"
    },
    "output": {
      "container": "mp4 or webm",
      "codec_recommendations": ["H.265 Main10", "VP9", "AV1"],
      "target_bitrate_mbps_4k": 28,
      "alpha_channel": false
    },
    "performance_notes": "Designed as an app background: low temporal complexity, no flashing, large quiet regions compress efficiently and loop losslessly."
  },

  "post_processing": {
    "bloom": {
      "enabled": true,
      "character": "restrained physical halation on true highlights only — sun core, brightest glints, waveform core",
      "threshold": "high",
      "intensity": 0.18,
      "note": "no exaggerated glow"
    },
    "lens_effects": {
      "veiling_glare": "subtle warm glare near the sun, physically motivated only",
      "chromatic_aberration": 0.04,
      "distortion": "0.2% barrel, cinema-prime typical",
      "bokeh_treatment": "optical — smooth discs, slight cat-eye at edges, no synthetic shapes"
    },
    "tone_mapping": {
      "curve": "soft filmic contrast with gentle cinematic highlight rolloff",
      "black_point": "lifted a touch — deep blue shadows retain detail"
    },
    "color_grade": {
      "look": "premium cinematic: deep blue shadows, warm golden highlights, neutral mids",
      "saturation": "slightly desaturated filmic look; oversaturation avoided everywhere, including the waveform",
      "dynamic_range": "high — natural HDR feel within an SDR master",
      "consistency": "grade is static across the loop — only light animates"
    },
    "vignette": { "enabled": true, "strength": 0.3, "softness": "wide, optical falloff" },
    "film_grain": {
      "enabled": true,
      "intensity": 0.015,
      "size": "fine 4K-scaled photochemical grain",
      "loop_safe": "grain pattern cycles with the 10 s loop"
    },
    "sharpening": "none beyond capture sharpness — the lens does the work",
    "overlays": "none — no text, no watermarks, no UI"
  },

  "constraints": {
    "no_text": true,
    "no_logos": true,
    "no_ui_elements": true,
    "no_people": true,
    "no_animals": true,
    "avoid": [
      "illustration", "stylized 3D", "CGI appearance", "low-poly mountains", "geometric mountains",
      "vector graphics", "cartoon look", "artificial gradients", "fake sun", "fake reflections",
      "simplistic microphone", "game-engine aesthetic", "excessive bloom", "excessive neon",
      "flat lighting", "symmetrical artificial landscape", "generic stock footage", "UI-looking waveform"
    ],
    "aesthetic": "calm, peaceful, sophisticated, premium — a luxury commercial frame",
    "motion_budget": "everything moves almost invisibly and naturally slowly; nothing distracts from interface content overlaid on top",
    "flash_safety": "no strobing or rapid luminance changes",
    "loop_requirement": "mathematically seamless and visually invisible at exactly 10.000 s",
    "overlay_readiness": "quiet upper and lower thirds; the microphone is the only strong focal point"
  }
}
</script>

<script>
(async () => {
  'use strict';

  // ------------------------------------------------------ spec resolution
  let SPEC = JSON.parse(document.getElementById('animation-spec').textContent);
  try {
    const res = await fetch('microphone-cinematic-animation.json', { cache: 'no-store' });
    if (res.ok) SPEC = await res.json();
  } catch (_) { /* file:// — la copie embarquée fait foi */ }

  const get = (path, fallback) => {
    const v = path.split('.').reduce((o, k) => (o && o[k] !== undefined) ? o[k] : undefined, SPEC);
    return v === undefined ? fallback : v;
  };
  const anim = id => (SPEC.animations || []).find(a => a.id === id) || {};

  const TAU = Math.PI * 2;
  const W = 1920, H = 1080;                               // espace logique 16:9 (le master 4K est à 2x)

  const DURATION = get('project.duration_seconds', 10);
  const HORIZON = Math.round(get('scene.composition.horizon_line_normalized_y', 0.611) * H);
  const SUNP = get('environment.sun.position_normalized', { x: 0.62, y: 0.435 });
  const SUN = { x: SUNP.x * W, y: SUNP.y * H };

  const SKY = get('environment.sky.colors', { zenith: '#16233f', mid: '#4c6a9c', horizon: '#f4c98a' });
  const WATER = get('materials.lake_water.colors', { near_horizon: '#22334f', foreground: '#101b2e' });
  const REFL_OPACITY = get('environment.water.reflections.opacity', 0.35);
  const REFL_SQUASH = get('environment.water.reflections.vertical_squash', 0.6);
  const TREE_COLOR = get('materials.pine_foliage.albedo', '#16202f');
  const RIM_COLOR = get('lighting.rim_light.color', 'rgba(240, 196, 137, 0.35)');
  const PARALLAX = get('camera.movement.parallax',
    { background_layers_factor: 0.65, midground_factor: 1.0, foreground_factor: 1.25 });
  const DOLLY_HALF = get('camera.movement.total_travel_percent', 1.0) / 200; // 1% → ±0.005
  const BREATHING = get('camera.lens.focus_breathing.enabled', true);
  const MICRO_DRIFT = get('camera.movement.micro_drift.enabled', true);
  const VIGNETTE = get('post_processing.vignette.strength', 0.3);

  const canvas = document.getElementById('stage');
  const S = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  canvas.width = W * S;
  canvas.height = H * S;
  const ctx = canvas.getContext('2d');

  // RNG déterministe : chaque chargement rend exactement la même scène.
  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const smoothstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  };

  function layerCanvas() {
    const c = document.createElement('canvas');
    c.width = W * S;
    c.height = H * S;
    const g = c.getContext('2d');
    g.scale(S, S);
    return [c, g];
  }

  // ---------------------------------------------------------------- relief
  function ridge(rng, baseY, step, jitter, lo, hi) {
    const pts = [];
    let y = baseY;
    for (let x = -80; x <= W + 80; x += step) {
      y = clamp(y + (rng() - 0.5) * jitter, lo, hi);
      pts.push([x, y]);
    }
    return pts;
  }

  function fillRidge(g, pts, gradTopY, gradBotY, topColor, botColor) {
    const grad = g.createLinearGradient(0, gradTopY, 0, gradBotY);
    grad.addColorStop(0, topColor);
    grad.addColorStop(1, botColor);
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (const [x, y] of pts) g.lineTo(x, y);
    g.lineTo(W + 80, H);
    g.lineTo(-80, H);
    g.closePath();
    g.fill();
  }

  // Liseré doré sur les pentes exposées au soleil (descendantes vers la droite).
  function rimLight(g, pts, color, width) {
    g.strokeStyle = color;
    g.lineWidth = width;
    g.lineCap = 'round';
    for (let i = 0; i < pts.length - 1; i++) {
      if (pts[i + 1][1] > pts[i][1]) {
        g.beginPath();
        g.moveTo(pts[i][0], pts[i][1]);
        g.lineTo(pts[i + 1][0], pts[i + 1][1]);
        g.stroke();
      }
    }
  }

  const rng = mulberry32(20260820);
  const farPts  = ridge(rng, 455, 46, 92, 335, 525);
  const midPts  = ridge(rng, 550, 38, 62, 472, 602);
  const nearPts = ridge(rng, 622, 30, 26, 592, 654);

  // ----------------------------------------------------- couches statiques
  const [skyC, skyG] = layerCanvas();
  {
    const grad = skyG.createLinearGradient(0, 0, 0, HORIZON + 30);
    grad.addColorStop(0, SKY.zenith);
    grad.addColorStop(0.55, SKY.mid);
    grad.addColorStop(1, SKY.horizon);
    skyG.fillStyle = grad;
    skyG.fillRect(0, 0, W, H);
  }

  // Cirrus fins pré-rendus (drift sinusoïdal au rendu).
  const [cloudC, cloudG] = layerCanvas();
  {
    const crng = mulberry32(3307);
    const groups = [[350, 140], [1150, 108], [1650, 190]];
    for (const [gx, gy] of groups) {
      const n = 4 + Math.floor(crng() * 3);
      for (let i = 0; i < n; i++) {
        const cx = gx + (crng() - 0.5) * 320;
        const cy = gy + (crng() - 0.5) * 34;
        const rx = 120 + crng() * 150;
        const ry = 8 + crng() * 10;
        const a = 0.03 + crng() * 0.045;
        const grad = cloudG.createRadialGradient(cx, cy, 0, cx, cy, rx);
        grad.addColorStop(0, `rgba(223,232,244,${a.toFixed(3)})`);
        grad.addColorStop(1, 'rgba(223,232,244,0)');
        cloudG.save();
        cloudG.translate(cx, cy);
        cloudG.scale(1, ry / rx);
        cloudG.translate(-cx, -cy);
        cloudG.fillStyle = grad;
        cloudG.fillRect(cx - rx, cy - rx, rx * 2, rx * 2);
        cloudG.restore();
      }
    }
  }

  const [farC, farG] = layerCanvas();
  {
    farG.filter = 'blur(3px)';                    // profondeur de champ : le plus loin = le plus doux
    fillRidge(farG, farPts, 335, 545, get('materials.snow_granite.snow.albedo', '#e6edf7'),
              get('materials.snow_granite.rock.albedo', '#6f83a8'));
    rimLight(farG, farPts, 'rgba(240,196,137,0.55)', 2.5);
    farG.filter = 'none';
  }

  const [midC, midG] = layerCanvas();
  {
    midG.filter = 'blur(1.5px)';
    fillRidge(midG, midPts, 472, 575, get('materials.alpine_rock.snow_patches_albedo', '#c7d4e6'),
              get('materials.alpine_rock.albedo', '#46597d'));
    rimLight(midG, midPts, 'rgba(240,196,137,0.30)', 2);
    midG.filter = 'none';
  }

  const [nearC, nearG] = layerCanvas();
  {
    nearG.filter = 'blur(0.75px)';
    fillRidge(nearG, nearPts, 592, 660, get('materials.forested_hillside.albedo', '#2e3f5e'), '#243350');
    nearG.filter = 'none';
  }

  // Paysage réfléchi dans le lac, écrasé et adouci.
  const [reflC, reflG] = layerCanvas();
  {
    reflG.save();
    reflG.filter = 'blur(2.5px)';
    reflG.translate(0, HORIZON);
    reflG.scale(1, -REFL_SQUASH);
    reflG.translate(0, -HORIZON);
    reflG.drawImage(skyC, 0, 0, W, H);
    reflG.drawImage(farC, 0, 0, W, H);
    reflG.drawImage(midC, 0, 0, W, H);
    reflG.drawImage(nearC, 0, 0, W, H);
    reflG.restore();
    reflG.filter = 'none';
    reflG.save();
    reflG.globalCompositeOperation = 'destination-in';
    reflG.fillStyle = '#fff';
    reflG.fillRect(0, HORIZON, W, H - HORIZON);
    reflG.restore();
  }

  const [vigC, vigG] = layerCanvas();
  {
    const grad = vigG.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 1.02);
    grad.addColorStop(0, 'rgba(6,10,20,0)');
    grad.addColorStop(1, `rgba(6,10,20,${(1.2 * VIGNETTE).toFixed(3)})`);
    vigG.fillStyle = grad;
    vigG.fillRect(0, 0, W, H);
  }

  // ------------------------------------------------------------- reflets
  const glints = [];
  {
    const grng = mulberry32(77123);
    const ks = (anim('water_micro_ripples').period_seconds_per_component || [10, 5, 10 / 3, 2.5])
      .map(p => Math.max(1, Math.round(10 / p)));
    for (let i = 0; i < 78; i++) {
      const d = grng();
      const y = HORIZON + 12 + d * d * 330;
      const x = grng() * W;
      const columnHalf = 70 + d * 190;
      glints.push({
        x, y,
        len: 12 + d * 46 + grng() * 22,
        k: ks[Math.floor(grng() * ks.length)],
        phase: grng() * TAU,
        drift: 4 + d * 7,
        warm: Math.abs(x - SUN.x) < columnHalf,
        alpha: 0.05 + d * 0.13
      });
    }
  }

  // ---------------------------------------------------- poussières éclairées
  const motes = [];
  {
    const mrng = mulberry32(9911);
    const count = Math.min(200, get('assets.atmospheric_particles.count', 180));
    for (let i = 0; i < count; i++) {
      const nearColumn = mrng() < 0.55;
      const x0 = nearColumn ? SUN.x + (mrng() - 0.5) * 340 : 640 + mrng() * 860;
      const y0 = 480 + mrng() * 470;
      motes.push({
        x0, y0,
        ax: 5 + mrng() * 11,
        ay: 4 + mrng() * 8,
        kx: 1 + Math.floor(mrng() * 2),
        ky: 1 + Math.floor(mrng() * 2),
        ka: 1 + Math.floor(mrng() * 4),
        p1: mrng() * TAU,
        p2: mrng() * TAU,
        p3: mrng() * TAU,
        r: 0.5 + mrng() * 0.8,
        warm: Math.abs(x0 - SUN.x) < 180,
        alpha: 0.04 + mrng() * 0.1
      });
    }
  }

  function drawMotes(g, t) {
    const p = t / DURATION;
    for (const m of motes) {
      const x = m.x0 + m.ax * Math.sin(TAU * m.kx * p + m.p1);
      const y = m.y0 + m.ay * Math.sin(TAU * m.ky * p + m.p2);
      const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(TAU * m.ka * p + m.p3));
      g.fillStyle = m.warm
        ? `rgba(240,208,160,${(m.alpha * tw).toFixed(3)})`
        : `rgba(200,216,236,${(m.alpha * tw * 0.7).toFixed(3)})`;
      g.beginPath();
      g.arc(x, y, m.r, 0, TAU);
      g.fill();
    }
  }

  // -------------------------------------------------------------- arbres
  const trees = [];
  {
    const trng = mulberry32(4451);
    const clusters = get('assets.distant_pines.clusters', [
      { position_normalized_x: 0.06, count: 4, height_normalized_range: [0.08, 0.13] },
      { position_normalized_x: 0.92, count: 3, height_normalized_range: [0.09, 0.14] }
    ]);
    for (const cl of clusters) {
      const [hMin, hMax] = cl.height_normalized_range;
      for (let i = 0; i < cl.count; i++) {
        trees.push({
          x: cl.position_normalized_x * W + (trng() - 0.5) * 150,
          y: HORIZON + 6 + trng() * 10,
          h: (hMin + trng() * (hMax - hMin)) * H,
          phase: trng() * TAU
        });
      }
    }
  }

  function drawPine(g, h) {
    const wBase = h * 0.44;
    g.fillStyle = 'rgba(20,26,38,0.9)';
    g.fillRect(-h * 0.02, -h * 0.14, h * 0.04, h * 0.14);
    g.fillStyle = TREE_COLOR;
    const tiers = 5;
    for (let i = 0; i < tiers; i++) {
      const f = i / tiers;
      const tw = wBase * (1 - f * 0.72);
      const yTop = -h * (0.32 + f * 0.68);
      const yBot = -h * (0.10 + f * 0.60);
      g.beginPath();
      g.moveTo(0, yTop);
      g.lineTo(tw / 2, yBot);
      g.lineTo(-tw / 2, yBot);
      g.closePath();
      g.fill();
    }
  }

  function drawTrees(g, t) {
    for (const tr of trees) {
      const sway = 0.008 * Math.sin(TAU * 2 * t / DURATION + tr.phase)
                 + 0.003 * Math.sin(TAU * 3 * t / DURATION + 2 * tr.phase);
      g.save();
      g.translate(tr.x, tr.y);
      g.rotate(sway);
      drawPine(g, tr.h);
      g.restore();
      g.save();
      g.translate(tr.x, tr.y + 2);
      g.scale(1, -0.55);
      g.rotate(-sway);
      g.globalAlpha = 0.22;
      drawPine(g, tr.h);
      g.restore();
    }
  }

  // ------------------------------------------------------------- brouillard
  const fogPhases = anim('fog_drift').phase_offsets_per_volume_radians || [0.0, 2.1, 4.2];
  const fogOpacity = get('environment.atmosphere.fog.opacity_range', [0.06, 0.2]);
  const fogDriftPx = (anim('fog_drift').drift_amplitude_normalized_x || 0.013) * W;
  const fogBreath = anim('fog_drift').density_breathing_amplitude || 0.05;
  const fogBlobs = [
    { bx: 400,  y: 520, rx: 720, ry: 42, band: 0, phase: 0.0 },
    { bx: 1330, y: 528, rx: 640, ry: 38, band: 0, phase: 2.1 },
    { bx: 830,  y: 566, rx: 760, ry: 44, band: 1, phase: 3.4 },
    { bx: 1710, y: 572, rx: 600, ry: 36, band: 1, phase: 4.9 },
    { bx: 210,  y: 610, rx: 680, ry: 40, band: 2, phase: 1.2 },
    { bx: 1080, y: 616, rx: 780, ry: 42, band: 2, phase: 5.6 }
  ];
  const fogBase = (fogOpacity[0] + fogOpacity[1]) / 2 * 0.85;

  function drawFog(g, t) {
    for (const m of fogBlobs) {
      const ph = fogPhases[m.band % fogPhases.length] + m.phase * 0.3;
      const xOff = fogDriftPx * Math.sin(TAU * t / DURATION + ph);
      const alpha = fogBase + fogBreath * Math.sin(TAU * t / DURATION + m.phase * 1.7);
      const cx = m.bx + xOff;
      const grad = g.createRadialGradient(cx, m.y, 0, cx, m.y, m.rx);
      grad.addColorStop(0, `rgba(214,226,240,${Math.max(0, alpha).toFixed(3)})`);
      grad.addColorStop(1, 'rgba(214,226,240,0)');
      g.save();
      g.translate(cx, m.y);
      g.scale(1, m.ry / m.rx);
      g.translate(-cx, -m.y);
      g.fillStyle = grad;
      g.fillRect(cx - m.rx, m.y - m.rx, m.rx * 2, m.rx * 2);
      g.restore();
    }
  }

  // --------------------------------------------------------- eau & lumière
  function drawWater(g, t) {
    const grad = g.createLinearGradient(0, HORIZON, 0, H);
    grad.addColorStop(0, WATER.near_horizon);
    grad.addColorStop(1, WATER.foreground);
    g.fillStyle = grad;
    g.fillRect(0, HORIZON, W, H - HORIZON);

    g.globalAlpha = REFL_OPACITY;
    g.drawImage(reflC, 0, 0, W, H);
    g.globalAlpha = 1;

    const hl = g.createLinearGradient(SUN.x - 700, 0, SUN.x + 700, 0);
    hl.addColorStop(0, 'rgba(242,179,112,0)');
    hl.addColorStop(0.5, 'rgba(255,214,160,0.30)');
    hl.addColorStop(1, 'rgba(242,179,112,0)');
    g.fillStyle = hl;
    g.fillRect(SUN.x - 700, HORIZON - 1.5, 1400, 3);

    const colAlpha = 0.22 * (0.88 + 0.12 * Math.sin(TAU * 3 * t / DURATION));
    g.save();
    g.translate(SUN.x, HORIZON + 175);
    g.scale(1, 2.55);
    const col = g.createRadialGradient(0, 0, 0, 0, 0, 105);
    col.addColorStop(0, `rgba(232,184,119,${colAlpha.toFixed(3)})`);
    col.addColorStop(1, 'rgba(232,184,119,0)');
    g.fillStyle = col;
    g.fillRect(-105, -105, 210, 210);
    g.restore();

    g.lineCap = 'round';
    for (const gl of glints) {
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(TAU * gl.k * t / DURATION + gl.phase));
      const x = gl.x + gl.drift * Math.sin(TAU * t / DURATION + gl.phase);
      g.strokeStyle = gl.warm
        ? `rgba(232,184,119,${(gl.alpha * tw * 1.5).toFixed(3)})`
        : `rgba(159,184,216,${(gl.alpha * tw).toFixed(3)})`;
      g.lineWidth = 1.6;
      g.beginPath();
      g.moveTo(x - gl.len / 2, gl.y);
      g.lineTo(x + gl.len / 2, gl.y);
      g.stroke();
    }
  }

  function drawSun(g, t) {
    const shimmer = 1 + 0.03 * Math.sin(TAU * 2 * t / DURATION);
    let grad = g.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 760);
    grad.addColorStop(0, 'rgba(244,180,110,0.34)');
    grad.addColorStop(0.5, 'rgba(238,166,104,0.14)');
    grad.addColorStop(1, 'rgba(238,166,104,0)');
    g.fillStyle = grad;
    g.fillRect(SUN.x - 800, SUN.y - 800, 1600, 1600);
    grad = g.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 290 * shimmer);
    grad.addColorStop(0, 'rgba(250,190,115,0.78)');
    grad.addColorStop(0.35, 'rgba(246,182,110,0.30)');
    grad.addColorStop(1, 'rgba(246,182,110,0)');
    g.fillStyle = grad;
    g.fillRect(SUN.x - 320, SUN.y - 320, 640, 640);
    grad = g.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 52);
    grad.addColorStop(0, 'rgba(255,236,198,1)');
    grad.addColorStop(0.45, 'rgba(255,214,150,0.85)');
    grad.addColorStop(1, 'rgba(255,214,150,0)');
    g.fillStyle = grad;
    g.fillRect(SUN.x - 56, SUN.y - 56, 112, 112);
  }

  // Halo chaud par-dessus les crêtes : l'aube déborde dans la vallée.
  function drawSunHaze(g, t) {
    const shimmer = 1 + 0.03 * Math.sin(TAU * 2 * t / DURATION);
    const grad = g.createRadialGradient(SUN.x, SUN.y + 60, 0, SUN.x, SUN.y + 60, 560 * shimmer);
    grad.addColorStop(0, 'rgba(244,180,110,0.16)');
    grad.addColorStop(1, 'rgba(244,180,110,0)');
    g.fillStyle = grad;
    g.fillRect(SUN.x - 580, SUN.y - 520, 1160, 1160);
  }

  // ------------------------------------------------------------ microphone
  const MIC = {
    cx: get('assets.microphone.position_normalized.x', 0.5) * W,
    headTop: 385, headBot: 655, headW: 164,
    ringTop: 640, ringBot: 668,
    bodyTop: 662, bodyBot: 858, bodyW: 118,
    rodTop: 852, rodBot: 968, rodW: 15,
    baseY: 972, baseRx: 128, baseRy: 21
  };

  function roundRectPath(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function drawMicrophone(g) {
    const m = MIC;
    const bodyColor = get('materials.mic_body_metal.base_color', '#101216');
    const grilleColor = get('materials.mic_grille_mesh.base_color', '#14171c');

    g.save();
    g.translate(m.cx, m.baseY + 10);
    g.scale(1, 0.16);
    const sh = g.createRadialGradient(0, 0, 0, 0, 0, m.baseRx * 1.45);
    sh.addColorStop(0, 'rgba(0,0,0,0.5)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sh;
    g.fillRect(-m.baseRx * 1.5, -m.baseRx * 1.5, m.baseRx * 3, m.baseRx * 3);
    g.restore();

    let grad = g.createLinearGradient(m.cx - m.baseRx, 0, m.cx + m.baseRx, 0);
    grad.addColorStop(0, '#0a0c0f');
    grad.addColorStop(0.5, '#1c1f25');
    grad.addColorStop(0.86, '#0d0f13');
    grad.addColorStop(1, '#23201a');
    g.fillStyle = grad;
    g.beginPath();
    g.ellipse(m.cx, m.baseY, m.baseRx, m.baseRy, 0, 0, TAU);
    g.fill();
    g.fillStyle = '#14161b';
    g.beginPath();
    g.ellipse(m.cx, m.baseY - 6, m.baseRx * 0.82, m.baseRy * 0.72, 0, 0, TAU);
    g.fill();

    grad = g.createLinearGradient(m.cx - m.rodW / 2, 0, m.cx + m.rodW / 2, 0);
    grad.addColorStop(0, '#0a0c0f');
    grad.addColorStop(0.45, '#22262d');
    grad.addColorStop(1, bodyColor);
    g.fillStyle = grad;
    g.fillRect(m.cx - m.rodW / 2, m.rodTop, m.rodW, m.rodBot - m.rodTop);

    grad = g.createLinearGradient(m.cx - m.bodyW / 2, 0, m.cx + m.bodyW / 2, 0);
    grad.addColorStop(0, '#0b0d10');
    grad.addColorStop(0.38, '#1a1d22');
    grad.addColorStop(0.62, '#15181d');
    grad.addColorStop(0.93, '#0c0e11');
    grad.addColorStop(1, '#191712');
    g.fillStyle = grad;
    roundRectPath(g, m.cx - m.bodyW / 2, m.bodyTop, m.bodyW, m.bodyBot - m.bodyTop, 16);
    g.fill();

    grad = g.createLinearGradient(m.cx - m.headW / 2, 0, m.cx + m.headW / 2, 0);
    grad.addColorStop(0, '#0d0f12');
    grad.addColorStop(0.4, '#23262c');
    grad.addColorStop(1, bodyColor);
    g.fillStyle = grad;
    roundRectPath(g, m.cx - m.headW / 2 - 5, m.ringTop, m.headW + 10, m.ringBot - m.ringTop, 9);
    g.fill();

    const hx = m.cx - m.headW / 2, hw = m.headW, hh = m.headBot - m.headTop;
    grad = g.createLinearGradient(hx, 0, hx + hw, 0);
    grad.addColorStop(0, '#0e1013');
    grad.addColorStop(0.42, '#1e2126');
    grad.addColorStop(0.8, '#111318');
    grad.addColorStop(1, '#1c1a15');
    g.fillStyle = grad;
    roundRectPath(g, hx, m.headTop, hw, hh, hw / 2);
    g.fill();

    g.save();
    roundRectPath(g, hx, m.headTop, hw, hh, hw / 2);
    g.clip();
    g.fillStyle = grilleColor;
    g.globalAlpha = 0.35;
    g.fillRect(hx, m.headTop, hw, hh);
    g.globalAlpha = 1;
    g.strokeStyle = 'rgba(0,0,0,0.38)';
    g.lineWidth = 1;
    for (let y = m.headTop + 5; y < m.headBot; y += 6.5) {
      g.beginPath(); g.moveTo(hx, y); g.lineTo(hx + hw, y); g.stroke();
    }
    g.strokeStyle = 'rgba(255,255,255,0.045)';
    for (let x = hx + 4; x < hx + hw; x += 6.5) {
      g.beginPath(); g.moveTo(x, m.headTop); g.lineTo(x, m.headBot); g.stroke();
    }
    const spec = g.createRadialGradient(m.cx - 34, m.headTop + 62, 0, m.cx - 34, m.headTop + 62, 120);
    spec.addColorStop(0, 'rgba(190,210,235,0.18)');
    spec.addColorStop(1, 'rgba(190,210,235,0)');
    g.fillStyle = spec;
    g.fillRect(hx, m.headTop, hw, hh);
    g.restore();

    // Liseré doré épousant le bord droit, côté soleil.
    g.strokeStyle = RIM_COLOR;
    g.lineWidth = 2;
    g.beginPath();
    g.arc(m.cx, m.headTop + hw / 2, hw / 2 - 1, -0.7, 0);
    g.lineTo(m.cx + hw / 2 - 1, m.headBot - hw / 2);
    g.arc(m.cx, m.headBot - hw / 2, hw / 2 - 1, 0, 0.5);
    g.stroke();
    g.beginPath();
    g.moveTo(m.cx + m.bodyW / 2 - 1, m.bodyTop + 12);
    g.lineTo(m.cx + m.bodyW / 2 - 1, m.bodyBot - 14);
    g.stroke();
    g.globalAlpha = 0.5;
    g.beginPath();
    g.moveTo(m.cx + m.rodW / 2 - 0.5, m.rodTop + 6);
    g.lineTo(m.cx + m.rodW / 2 - 0.5, m.rodBot - 4);
    g.stroke();
    g.globalAlpha = 1;
  }

  // Micro pré-rendu une fois, plus son reflet écrasé et flouté dans le lac.
  const [micC, micG] = layerCanvas();
  drawMicrophone(micG);

  const MIC_REFL = get('assets.microphone.reflection_in_lake', { enabled: true, opacity: 0.12 });
  const [micReflC, micReflG] = layerCanvas();
  if (MIC_REFL.enabled) {
    micReflG.save();
    micReflG.filter = 'blur(3px)';
    micReflG.translate(0, MIC.baseY);
    micReflG.scale(1, -0.22);
    micReflG.translate(0, -MIC.baseY);
    micReflG.drawImage(micC, 0, 0, W, H);
    micReflG.restore();
    micReflG.filter = 'none';
    micReflG.save();
    micReflG.globalCompositeOperation = 'destination-in';
    micReflG.fillStyle = '#fff';
    micReflG.fillRect(0, MIC.baseY + 6, W, H - MIC.baseY - 6);
    micReflG.restore();
  }

  // -------------------------------------------------------------- onde vocale
  const WAVE = {
    cx: get('assets.voice_waveform.geometry.position_normalized.center_x', 0.5) * W,
    baseY: get('assets.voice_waveform.geometry.position_normalized.baseline_y', 0.815) * H,
    halfW: get('assets.voice_waveform.geometry.width_normalized', 0.4) * W / 2,
    samples: 192
  };
  const WAVE_CORE = get('materials.waveform_emissive.core_color', '#3fd8ff');
  const WAVE_EDGE = get('materials.waveform_emissive.edge_color', '#2f8fff');
  const WAVE_GLOW = 'rgba(63,216,255,0.55)';
  const MIRROR_OPACITY = get('materials.waveform_emissive.mirror_trace.opacity', 0.18);
  const SPILL_MAX = get('materials.waveform_emissive.light_spill.max_contribution', 0.08);
  const ENV_FLOOR = get('assets.voice_waveform.behavior.amplitude_envelope.floor', 0.12);

  // Rythme de parole : phases dispersées pour qu'aucune montée ne ressemble à
  // une autre dans la boucle — seule la période complète de 10 s se répète.
  const ENV_K = get('assets.voice_waveform.behavior.amplitude_envelope.temporal_frequencies_hz',
    [0.1, 0.2, 0.3, 0.5, 0.7]).map(f => Math.max(1, Math.round(f * 10)));
  const ENV_PH = [0.9, 4.1, 2.3, 5.6, 1.7, 3.2, 0.4, 5.0];
  const ENV_W  = [0.30, 0.24, 0.20, 0.15, 0.11, 0.08, 0.06, 0.05];

  function voiceEnvelope(t) {
    const p = t / DURATION;
    let raw = 0, wsum = 0;
    for (let i = 0; i < ENV_K.length; i++) {
      const w = ENV_W[i % ENV_W.length];
      raw += w * (0.5 + 0.5 * Math.sin(TAU * ENV_K[i] * p + ENV_PH[i % ENV_PH.length]));
      wsum += w;
    }
    raw /= wsum;
    return ENV_FLOOR + (1 - ENV_FLOOR) * smoothstep(0.34, 0.66, raw);
  }

  const CARRIERS = get('assets.voice_waveform.behavior.carrier_waves', [
    { spatial_cycles: 2.2, temporal_frequency_hz: 0.7, relative_amplitude: 1.0, direction: 'leftward' },
    { spatial_cycles: 4.7, temporal_frequency_hz: 0.4, relative_amplitude: 0.42, direction: 'rightward' },
    { spatial_cycles: 8.3, temporal_frequency_hz: 0.9, relative_amplitude: 0.2, direction: 'leftward' }
  ]).map((c, i) => ({
    s: c.spatial_cycles,
    k: Math.max(1, Math.round(c.temporal_frequency_hz * 10)),
    a: 34 * c.relative_amplitude,
    dir: c.direction === 'rightward' ? 1 : -1,
    ph: [0.5, 2.0, 4.2, 1.1][i % 4]
  }));

  function waveY(u, t, env) {
    const p = t / DURATION;
    const hann = 0.5 - 0.5 * Math.cos(TAU * u);
    let y = 0;
    for (const c of CARRIERS) y += c.a * Math.sin(TAU * (c.s * u + c.dir * c.k * p) + c.ph);
    return env * hann * y;
  }

  function tracePath(g, t, env, yScale, yOff) {
    g.beginPath();
    for (let i = 0; i <= WAVE.samples; i++) {
      const u = i / WAVE.samples;
      const x = WAVE.cx - WAVE.halfW + u * WAVE.halfW * 2;
      const y = WAVE.baseY + (yOff || 0) + waveY(u, t, env) * yScale;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
  }

  function waveGradient(g) {
    const grad = g.createLinearGradient(WAVE.cx - WAVE.halfW, 0, WAVE.cx + WAVE.halfW, 0);
    grad.addColorStop(0, WAVE_EDGE);
    grad.addColorStop(0.3, WAVE_CORE);
    grad.addColorStop(0.7, WAVE_CORE);
    grad.addColorStop(1, WAVE_EDGE);
    return grad;
  }

  // Le segment qui passe DERRIÈRE le micro : atténué, dessiné avant lui.
  function drawWaveBehind(g, t, env) {
    g.save();
    g.beginPath();
    g.rect(MIC.cx - 130, 0, 260, H);
    g.clip();
    g.globalAlpha = 0.22;
    g.strokeStyle = waveGradient(g);
    g.lineCap = 'round';
    g.lineWidth = 2.5;
    tracePath(g, t, env, 0.9, -7);
    g.stroke();
    g.restore();
  }

  function drawWaveform(g, t, env) {
    // Halo que l'onde projette sur l'eau (light spill de la spec).
    g.save();
    g.translate(WAVE.cx, WAVE.baseY + 26);
    g.scale(1, 0.14);
    const pool = g.createRadialGradient(0, 0, 0, 0, 0, 430);
    pool.addColorStop(0, `rgba(63,216,255,${(SPILL_MAX * 1.3 * env).toFixed(3)})`);
    pool.addColorStop(1, 'rgba(63,216,255,0)');
    g.fillStyle = pool;
    g.fillRect(-440, -440, 880, 880);
    g.restore();

    const grad = waveGradient(g);
    g.save();
    g.lineCap = 'round';
    g.lineJoin = 'round';

    g.globalAlpha = MIRROR_OPACITY;
    g.strokeStyle = grad;
    g.lineWidth = 2;
    tracePath(g, t, env, -0.35, 0);
    g.stroke();

    g.globalAlpha = 0.16;
    g.shadowColor = WAVE_GLOW;
    g.shadowBlur = 26;
    g.lineWidth = 8;
    tracePath(g, t, env, 1, 0);
    g.stroke();

    g.globalAlpha = 0.95;
    g.shadowBlur = 14;
    g.lineWidth = 3;
    g.stroke();
    g.restore();
  }

  // --------------------------------------------------------------- caméra
  function zoom(t) {
    return 1 + DOLLY_HALF * (1 - Math.cos(TAU * t / DURATION));   // 1.000 → 1.010 → 1.000
  }

  function withCam(g, z, parallaxFactor, draw) {
    const s = 1 + (z - 1) * parallaxFactor;
    g.save();
    g.translate(W / 2, H / 2);
    g.scale(s, s);
    g.translate(-W / 2, -H / 2);
    draw();
    g.restore();
  }

  // ---------------------------------------------------------------- frame
  const DRIFT_A = 0.0002 * W;

  function render(t) {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    const p = t / DURATION;

    // Respiration optique + micro-dérive stabilisée, sous un léger surcadrage
    // constant (1.004) pour que les bords restent toujours couverts.
    const breath = BREATHING ? 1 + 0.0015 * Math.sin(TAU * p) : 1;
    const dx = MICRO_DRIFT ? DRIFT_A * (Math.sin(TAU * 2 * p + 0.7) + 0.6 * Math.sin(TAU * 3 * p + 1.4)) : 0;
    const dy = MICRO_DRIFT ? DRIFT_A * (Math.sin(TAU * 2 * p + 3.9) + 0.6 * Math.sin(TAU * 3 * p + 5.1)) : 0;
    ctx.translate(W / 2 + dx, H / 2 + dy);
    ctx.scale(1.004 * breath, 1.004 * breath);
    ctx.translate(-W / 2, -H / 2);

    const z = zoom(t);
    const cloudOff = 0.004 * W * Math.sin(TAU * p + 1.3);

    withCam(ctx, z, PARALLAX.background_layers_factor, () => {
      ctx.drawImage(skyC, 0, 0, W, H);
      ctx.drawImage(cloudC, cloudOff, 0, W, H);
      drawSun(ctx, t);
      ctx.drawImage(farC, 0, 0, W, H);
      ctx.drawImage(midC, 0, 0, W, H);
      drawFog(ctx, t);
      drawSunHaze(ctx, t);
      ctx.drawImage(nearC, 0, 0, W, H);
      drawWater(ctx, t);
    });

    withCam(ctx, z, PARALLAX.midground_factor, () => {
      drawTrees(ctx, t);
      drawMotes(ctx, t);
    });

    const env = voiceEnvelope(t);
    withCam(ctx, z, PARALLAX.foreground_factor, () => {
      if (MIC_REFL.enabled) {
        ctx.globalAlpha = MIC_REFL.opacity;
        ctx.drawImage(micReflC, 0, 0, W, H);
        ctx.globalAlpha = 1;
      }
      drawWaveBehind(ctx, t, env);
      ctx.drawImage(micC, 0, 0, W, H);
      drawWaveform(ctx, t, env);
    });

    // La vignette est un effet d'optique : fixe par rapport au cadre.
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.drawImage(vigC, 0, 0, W, H);
  }

  // ---------------------------------------------------------------- boucle
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let frozenTime = reduceMotion ? 2.5 : null;
  const t0 = performance.now();
  let rafPending = false;

  function tick(now) {
    rafPending = false;
    const t = frozenTime !== null ? frozenTime % DURATION : ((now - t0) / 1000) % DURATION;
    render(t);
    if (frozenTime === null) {
      rafPending = true;
      requestAnimationFrame(tick);
    }
  }
  rafPending = true;
  requestAnimationFrame(tick);

  // Hook de test headless (pas un élément d'UI) : fige ou relâche l'horloge.
  window.__ANIM = {
    duration: DURATION,
    spec: SPEC,
    setTime(t) {
      frozenTime = t;
      if (!rafPending) { rafPending = true; requestAnimationFrame(tick); }
    },
    play() {
      if (frozenTime !== null) {
        frozenTime = null;
        if (!rafPending) { rafPending = true; requestAnimationFrame(tick); }
      }
    }
  };
})();
</script>
</body>
</html>
